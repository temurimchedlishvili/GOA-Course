<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<title>ჩემი პატარა საიტი</title>
<style>
    body {font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5;}
    h1 {color: #333;}
    .style-list {list-style: none; padding: 0;}
    .style-list li {background: #fff; margin: 6px 0; padding: 8px; border-radius: 6px;}
    .style-form {background: #fff; padding: 10px; border-radius: 6px; margin-top: 20px;}
    .style-form input, .style-form textarea {width: 100%; margin: 6px 0; padding: 6px;}
    .btn {background: #4caf50; color: #fff; padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer;}
</style>
</head>
<body>
<h1>ჩემი პატარა საიტი ☕</h1>

<h2>საყვარელი ყავები</h2><ul class="style-list">
    <li>ესპრესო</li>
    <li>ლატე</li>
    <li>კაპუჩინო</li>
</ul>

<h2>დაგვიკავშირდი</h2>
<form class="style-form">
    <input type="text" placeholder="სახელი" required>
    <input type="email" placeholder="ელფოსტა" required>
    <textarea placeholder="შენი შეტყობინება"></textarea>
    <button class="btn">გაგზავნა</button>
</form>
</body>
</html>
