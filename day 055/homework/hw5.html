<!--შექმენი სამი div და ყველას მიეცი განსხვავებული display:
პირველი → display: block;
მეორე → display: inline;
მესამე → display: inline-block;
ავხსენი:
რა განსხვავებაა block, inline და inline-block შორის?-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="hw5.css">
    <title>Display მაგალითი</title>
</head>
<body>
    <div class="block-div">Block</div>
    <div class="inline-div">Inline</div>
    <div class="inline-block-div">Inline-Block</div>
</body>
</html>
