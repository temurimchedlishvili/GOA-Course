<!-- 1. Content (შიგთავსი)

აქ მდებარეობს ელემენტის რეალური შიგთავსი — ტექსტი, სურათი და სხვა.

მის ზომას ვაკონტროლებთ width და height ატრიბუტებით.

2. Padding (შიგნითა დაშორება)

სივრცე content-სა და border-ს შორის.

Padding ზრდის ელემენტის მთლიანი ზომას (თუ არ გამოიყენება box-sizing: border-box).

მაგალითი: padding: 20px; → შიგთავსი 20px-ით შორდება ყველა საზღვარს შიგნით.

3. Border (საზღვარი)

ელემენტის გარე კიდე, რომელიც გარს აკრავს padding-სა და content-ს.

შეგვიძლია მივანიჭოთ სისქე, ფერი და სტილი.

მაგალითი: border: 5px solid black;

4. Margin (გარე დაშორება)

სივრცე ელემენტსა და სხვა ელემენტებს/გვერდის საზღვარს შორის.

Margin არ ემატება ელემენტის ზომას — ის უბრალოდ ქმნის სივრცეს გარეთ. -->
