<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="hw5.css">
    <title>Document</title>
</head>
<body>
    <!-- მაგალითი 1: span არის inline ელემენტი -->
<span>ეს არის SPAN</span>
<span>ესეც SPAN</span>

<!-- მაგალითი 2: a არის inline ელემენტი -->
<a href="#">ეს არის ლინკი</a>
<a href="#">მეორე ლინკი</a>

<!-- მაგალითი 3: b არის inline ელემენტი -->
<b>გაბოლდებული ტექსტი</b>
<b>კიდევ ერთი</b>

<!-- მაგალითი 4: i არის inline ელემენტი -->
<i>იტალიკი</i>
<i>მეორე იტალიკი</i>

<!-- მაგალითი 5: strong არის inline ელემენტი -->
<strong>ძალიან მნიშვნელოვანი ტექსტი</strong>
<strong>მეორე მნიშვნელოვანი ტექსტი</strong>


</body>
</html>
