<!-- 
block VS inline

1) Block:
- იკავებს მთელ ხაზს (100% სიგანეს).
- იწყება ახალი ხაზიდან.
- შეიძლება ჰქონდეს width და height.
- მაგალითად: <div>, <p>, <h1>.

2) Inline:
- იკავებს მხოლოდ იმდენ ადგილს, რამდენიც კონტენტს სჭირდება.
- ახალ ხაზზე არ გადადის, შეიძლება გვერდზე დადგეს სხვა ელემენტიც.
- width და height პირდაპირ ვერ მიენიჭება.
- მაგალითად: <span>, <a>, <b>.
-->
