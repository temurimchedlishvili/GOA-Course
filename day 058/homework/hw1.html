<!-- 
display არის CSS-ის ატრიბუტი,
რომელიც განსაზღვრავს, როგორ დაიკავოს ადგილი ელემენტმა ვებგვერდზე 
და როგორ გამოჩნდეს სხვა ელემენტებთან მიმართებაში.
-->

<!-- 
ძირითადი მნიშვნელობები:
1) display: block; 
→ ელემენტი იკავებს მთელ ხაზს (width 100%),
    მის გვერდით სხვა ელემენტი ვერ დადგება.
    მაგალითი: <div>, <p>, <h1> ...

2) display: inline;
→ ელემენტი იკავებს იმდენ ადგილს, რამდენიც სჭირდება.
    მის გვერდით სხვა ელემენტიც დგება.
    მაგალითი: <span>, <a>, <b> ...

3) display: inline-block;
→ მუშაობს როგორც inline (ერთ ხაზზე შეიძლება),
    მაგრამ block-ის მსგავსად შეიძლება ჰქონდეს width და height.

4) display: none;
→ ელემენტი საერთოდ ქრება გვერდიდან, 
    თითქოს არ არსებობს (არც ადგილი უჭირავს).
-->
