<!-- 
block ელემენტები:
- იკავებს მთელ ხაზს (100% სიგანეს).
- იწყება ახალი ხაზიდან.
- შეიძლება ჰქონდეს width, height, margin, padding.
- მაგალითები: <div>, <p>, <h1> ...
-->

<!-- 
inline ელემენტები:
- იკავებს იმდენ ადგილს, რამდენიც ტექსტს ან კონტენტს სჭირდება.
- ახალ ხაზზე არ გადადის.
- width და height პირდაპირ ვერ ეძლევა (მხოლოდ content-ის ზომაზეა დამოკიდებული).
- მაგალითები: <span>, <a>, <b>, <i> ...
-->
