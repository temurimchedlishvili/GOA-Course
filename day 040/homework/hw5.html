<!--Responsive (რეაგირებადი, ადაპტირებადი) ვებ დიზაინი ნიშნავს იმას, რომ ვებსაიტი ან აპლიკაცია ისე იკიდებს თავს, რომ სხვადასხვა ეკრანზე (მობილურ ტელეფონზე, ტაბლეტზე, ლეპტოპზე, დიდ მონიტორზე) მოსახერხებელი და კარგად მოწესრიგებული იყოს.

მარტივად რომ ვთქვათ, responsive დიზაინი ამოცნობს მომხმარებლის მოწყობილობის ეკრანის ზომას და შესაბამისად ცვლის გვერდის ელემენტების განლაგებას, ზომებს, შრიფტებს და ა.შ., რათა მომხმარებელმა ყველა მოწყობილობაზე კარგი და წასაკითხი გამოცდილება მიიღოს.-->
